name: Build & Release (Android APK)

# 触发: 手动运行 (Actions 页面 Run workflow), 或推送 v* 标签 (如 v1.0.1)
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # 创建 Release / 上传资产

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 本地构建(--local)需要 JDK 17 + Android SDK; ubuntu 跑步机预装 Android SDK
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 补齐缺失的 SDK 组件并接受许可(NDK/平台版本随 Expo SDK 升级可能变化)
      - name: Ensure Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" \
            "ndk;27.1.12297006" "cmake;3.22.1" > /dev/null

      # 认证: 优先 EXPO_TOKEN (expo.dev Access Token);
      # 否则恢复本地导出的 EAS 会话 (secrets.EAS_SESSION_JSON = ~/.expo/state.json 内容)
      # 注意必须用 env 传递而不是 ${{ }} 内插: secret 值含 \" 转义, 内插会被 bash 二次处理导致 JSON 损坏
      - name: Authenticate with EAS
        env:
          EAS_SESSION_JSON: ${{ secrets.EAS_SESSION_JSON }}
        run: |
          mkdir -p ~/.expo
          printf '%s' "$EAS_SESSION_JSON" > ~/.expo/state.json
          node -e "JSON.parse(require('fs').readFileSync(process.env.HOME+'/.expo/state.json','utf8')); console.log('state.json valid')"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      # 用 EAS 本地构建(在 runner 上直接 Gradle 编译):
      # 1) 不消耗 Expo Free 云端构建配额  2) 自动从 EAS 服务器拉取托管签名密钥, 与历史包同签名
      - name: Build Android APK (EAS local build)
        run: |
          npx eas-cli@latest build \
            --platform android \
            --profile preview \
            --local \
            --non-interactive \
            --output class-schedule.apk
          ls -la class-schedule.apk

      - name: Create GitHub Release and upload APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v$(node -e "console.log(require('./app.json').expo.version)")"
          fi
          APK_NAME="class-schedule-${TAG}.apk"
          mv class-schedule.apk "$APK_NAME"
          TITLE="课表助手 $TAG"
          NOTES="自动构建于 $(date -u '+%Y-%m-%d %H:%M UTC')

          - 下载 $APK_NAME 直接安装
          - 覆盖安装不会丢失课表设置与本地数据"
          # 版本号带连字符后缀(如 v1.11.6-pre / v1.12.0-rc.1) → 标记为预发布版本
          PRERELEASE_FLAG=""
          case "$TAG" in
            *-*) PRERELEASE_FLAG="--prerelease" ;;
          esac
          gh release create "$TAG" "$APK_NAME" --title "$TITLE" --notes "$NOTES" $PRERELEASE_FLAG \
            || gh release upload "$TAG" "$APK_NAME" --clobber
