name: Build & Release (Android APK)

# 触发: 手动运行 (Actions 页面 Run workflow), 或推送 v* 标签 (如 v1.0.1)
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # 创建 Release / 上传资产

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 认证: 优先 EXPO_TOKEN (expo.dev Access Token);
      # 否则恢复本地导出的 EAS 会话 (secrets.EAS_SESSION_JSON = ~/.expo/state.json 内容)
      # 注意必须用 env 传递而不是 ${{ }} 内插: secret 值含 \" 转义, 内插会被 bash 二次处理导致 JSON 损坏
      - name: Authenticate with EAS
        env:
          EAS_SESSION_JSON: ${{ secrets.EAS_SESSION_JSON }}
        run: |
          mkdir -p ~/.expo
          printf '%s' "$EAS_SESSION_JSON" > ~/.expo/state.json
          node -e "JSON.parse(require('fs').readFileSync(process.env.HOME+'/.expo/state.json','utf8')); console.log('state.json valid')"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build Android APK (EAS, waits for completion)
        shell: bash
        run: |
          set +e
          npx eas-cli@latest build \
            --platform android \
            --profile preview \
            --non-interactive \
            --wait \
            --json > build-meta.json 2> build-err.log
          code=$?
          echo "exit code: $code"
          echo "--- stdout ---"
          cat build-meta.json || true
          echo "--- stderr ---"
          cat build-err.log || true
          if [ $code -ne 0 ] || [ ! -s build-meta.json ]; then
            echo "::error::EAS build command failed (see stdout/stderr above)"
            exit 1
          fi

      - name: Download APK
        run: |
          URL=$(node -e "const a=require('./build-meta.json');const b=Array.isArray(a)?a[a.length-1]:a;console.log((b.artifacts&&b.artifacts.buildUrl)||'')")
          echo "APK URL: $URL"
          test -n "$URL"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            APK_NAME="class-schedule-${GITHUB_REF_NAME}.apk"
          else
            APK_NAME="class-schedule-v$(node -e "console.log(require('./app.json').expo.version)").apk"
          fi
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
          curl -L --retry 3 -o "$APK_NAME" "$URL"
          ls -la "$APK_NAME"

      - name: Create GitHub Release and upload APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v$(node -e "console.log(require('./app.json').expo.version)")"
          fi
          TITLE="课表助手 $TAG"
          NOTES="自动构建于 $(date -u '+%Y-%m-%d %H:%M UTC')

          - 下载 $APK_NAME 直接安装
          - 覆盖安装不会丢失课表设置与本地数据"
          gh release create "$TAG" "$APK_NAME" --title "$TITLE" --notes "$NOTES" \
            || gh release upload "$TAG" "$APK_NAME" --clobber
